postgres:
  enabled: true
app:
  tag: local
#  image: localhost:5000/servicex_app
  image: k3d-local-registry:5000/servicex_app
#  pullPolicy: IfNotPresent
  pullPolicy: Always
# objectStore:
#   publicURL: localhost:9000
objectStore:
  enabled: true
  type: eos
  internal: false
  eos:
    host: eos.cms.rcac.purdue.edu
    protocol: root
    pathPrefix: /store/user/piperov
    useBucketDirectory: "true"
gridAccount: piperov

transformer:
  cachePrefix: "''"
  autoscaler:
    enabled: true
    maxReplicas: 2
    minReplicas: 1
#  sidecarImage: k3d-local-registry:5000/servicex-transformer-sidecar
#  sidecarTag: local
#  sidecarPullPolicy: Always
  sidecarImage: servicex-transformer-sidecar
  sidecarTag: local
  sidecarPullPolicy: Never  # Forces it to use the node's local cache
#  PullPolicy: IfNotPresent
  tag: local
  image: k3d-local-registry:5000/servicex-transformer-sidecar
  pullPolicy: Always
###  language: python
###  exec: |
###    '''
###    import os, time
###    while not os.path.exists('/servicex/output/x509up'):
###        print("Waiting for x509up proxy file...")
###        time.sleep(2)
###    print("Proxy file found! Running transformer...")
###    exec(open('/generated/transform_single_file.py').read())
###    '''

####  language: python
####  exec: 'import os, time; print("Waiting for proxy..."); [time.sleep(2) for _ in iter(int, 1) if not os.path.exists("/servicex/output/x509up")]; exec(open("/generated/transform_single_file.py").read())'

  language: python
  exec: /generated/transform_single_file.py
##   language: python
##   exec: bash -c 'until [ -f /servicex/output/x509up ]; do echo "Waiting for x509up proxy file..."; sleep 2; done; echo "File found! Starting transformer."; python /generated/transform_single_file.py'


  scienceContainerPullPolicy: IfNotPresent
# allow transformer to talk to the external network, so that it can reach EOS
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

codeGen:
  uproot-raw:
    enabled: true
    image: sslhep/servicex_code_gen_raw_uproot
    tag: "v1.8.3"
    defaultScienceContainerImage: sslhep/servicex_science_image_combined_root
    defaultScienceContainerTag: 5.7.2-6.38.04
    compressionAlgorithm: ZSTD
    compressionLevel: 0
  atlasr21:
    enabled: false
  atlasr22:
    enabled: false
  atlasr25:
    enabled: false
  topcp:
    enabled: false
didFinder:
  rucio:
    enabled: false
#    pullPolicy: Always
    rucio_host: http://cms-rucio.cern.ch
    auth_host: https://cms-rucio-auth.cern.ch
    threads: 2
    site: T2_US_Purdue
  CERNOpenData:
    enabled: true
    pullPolicy: Always
  xrootd:
    enabled: true
    image: sslhep/servicex-did-finder-xrootd
    tag: "v1.8.3"
  atlasopenmagic:
    enabled: false
x509Secrets:
  # tag: "v1.8.3"
  vomsOrg: cms

